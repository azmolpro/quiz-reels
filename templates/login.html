{% extends "base.html" %}
{% block titulo %}Ingresar — Quiz Reels{% endblock %}
{% block contenido %}

<div class="card" style="max-width:360px; margin: 60px auto 0;">
  <h2>🔒 Ingresá la clave</h2>
  <p class="muted">Este sitio genera contenido y usa tu cuota de IA — solo vos deberías poder entrar.</p>
  {% if error %}
    <p style="color:#b91c1c; font-weight:600;">{{ error }}</p>
  {% endif %}
  <form method="post">
    <input type="password" name="password" placeholder="Clave" autofocus
           style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); margin-bottom:12px; font-size:1rem;">
    <button class="btn" type="submit" style="width:100%;">Entrar</button>
  </form>
</div>

{% endblock %}
