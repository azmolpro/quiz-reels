<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Quiz Reels{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f1fb;
      --surface: #ffffff;
      --surface-alt: #ece9f9;
      --text: #1f1b3a;
      --text-muted: #5b5578;
      --accent: #5b3df5;
      --accent-ink: #ffffff;
      --border: #ddd8f0;
      --verde: #22c55e;
      --rojo: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Karla', system-ui, sans-serif;
      padding: 24px 16px 60px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1, h2, h3 {
      font-family: 'Fredoka', system-ui, sans-serif;
      font-weight: 700;
      margin: 0 0 8px;
    }
    a { color: var(--accent); }
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .topbar .logo {
      font-family: 'Fredoka', system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(31,27,58,0.05), 0 6px 18px rgba(31,27,58,0.05);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Fredoka', system-ui, sans-serif;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 14px;
      padding: 14px 22px;
      cursor: pointer;
      text-decoration: none;
      background: var(--accent);
      color: var(--accent-ink);
    }
    .btn:hover { opacity: 0.92; }
    .btn.secundario {
      background: var(--surface-alt);
      color: var(--text);
    }
    .btn.verde { background: var(--verde); }
    .muted { color: var(--text-muted); font-size: 0.92rem; }
    .fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tag.listo { background: #dcfce7; color: #15803d; }
    .tag.procesando { background: #fef3c7; color: #b45309; }
    .tag.borrador { background: var(--surface-alt); color: var(--text-muted); }
    .tag.error { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <span class="logo">🧠 Quiz Reels</span>
    </div>
    {% block contenido %}{% endblock %}
  </div>
</body>
</html>
